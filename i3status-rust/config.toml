[theme]
theme = "semi-native"

[icons]
icons = "awesome6"

[[block]]
block = "focused_window"

[[block]]
block = "net"

[[block]]
block = "disk_space"
format = " $icon $available "

[[block]]
block = "memory"
format = " $icon $mem_used.eng(prefix:Mi) ($mem_used_percents.eng(w:2)) "

[[block]]
block = "cpu"
interval = 5

[[block]]
block = "load"
interval = 5

[[block]]
block = "battery"
interval = 10
driver = "sysfs"

[[block]]
block = "sound"
driver = "pulseaudio"

[[block]]
block = "music"

[[block]]
block = "time"
interval = 5
format = " $icon $timestamp.datetime(f:'%V: %d/%m %R')"

