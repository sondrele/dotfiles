# Noctalia reads every *.toml in ~/.config/noctalia/ and merges them. Changes made in Noctalia's
# settings dialog are saved to ~/.local/state/noctalia/settings.toml instead, and win over this
# file, so move keepers from there to here and remove them there. Reference:
# https://docs.noctalia.dev/noctalia/configuration/

[bar.default]
position = "bottom"
# the defaults, plus the focused window's title, since windows have no title bars
start = ["launcher", "wallpaper", "workspaces", "active_window"]

[theme]
source = "builtin"                 # builtin | community | wallpaper
builtin = "Dracula"
community_palette = "Oxocarbon"    # used when source = "community"

# Lock after 10 minutes without input. Apps that inhibit idle (video in a browser, presentations)
# hold it off. Noctalia ships this behavior, but disabled.
[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true
